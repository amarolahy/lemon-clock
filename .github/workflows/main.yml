name: Deploy to Prod
on:
  push:
    branches: [main]

concurrency:
  group: deploy-solvers-mg
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Configure SSH proxy jump
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BASTION_KEY }}" > ~/.ssh/bastion_key
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/bastion_key ~/.ssh/deploy_key
          cat >> ~/.ssh/config << EOF
          Host bastion
            HostName ${{ secrets.BASTION_HOST }}
            User ${{ secrets.BASTION_USER }}
            IdentityFile ~/.ssh/bastion_key
            StrictHostKeyChecking no

          Host target-server
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            ProxyJump bastion
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -rlpDz --delete
          path: dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: target-server
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      - name: Health check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 ${{ secrets.APP_URL }})
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Health check failed (HTTP $code)"
            exit 1
          fi

      - name: Mark deploy as failed
        if: failure()
        run: echo "::error::Deploy or health check failed for ${{ secrets.APP_URL }}"
